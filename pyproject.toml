[project]
name = "wayguard-mcp"
version = "0.1.0"
description = "Read-only, policy-gated SSH diagnostics exposed over MCP (stdio)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
]

[project.scripts]
wayguard-mcp = "wayguard.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wayguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S102", "S307", "S602", "S605"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
